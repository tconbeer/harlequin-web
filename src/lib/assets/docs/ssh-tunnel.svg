<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-labelledby="t d" font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
  <title id="t">An SSH tunnel to a Postgres database</title>
  <desc id="d">Harlequin connects to localhost port 15432, where the ssh client listens. The ssh client carries that traffic over an encrypted connection to bastion.example.com, which delivers it to Postgres at db.internal port 5432.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
    </marker>
  </defs>
  <g stroke="#000" stroke-width="2" fill="none">
    <rect x="12" y="34" width="260" height="232" rx="8" stroke-dasharray="6 5" />
    <rect x="32" y="66" width="220" height="54" rx="6" fill="#FFB6D9" />
    <rect x="32" y="178" width="220" height="64" rx="6" fill="#45FFCA" />
    <rect x="396" y="178" width="196" height="64" rx="6" fill="#45FFCA" />
    <rect x="676" y="178" width="132" height="64" rx="6" fill="#D67BFF" />
    <path d="M 142 120 L 142 172" marker-end="url(#arrow)" />
    <path d="M 272 210 L 390 210" marker-end="url(#arrow)" />
    <path d="M 592 210 L 670 210" marker-end="url(#arrow)" />
  </g>
  <g fill="#000">
    <text x="26" y="54" font-size="12">your computer</text>
    <text x="142" y="99" font-size="15" text-anchor="middle">harlequin / hsql</text>
    <text x="154" y="140" font-size="11">connects to</text>
    <text x="154" y="155" font-size="11">localhost:15432</text>
    <text x="142" y="204" font-size="15" text-anchor="middle">ssh</text>
    <text x="142" y="226" font-size="11" text-anchor="middle">listening on localhost:15432</text>
    <text x="331" y="152" font-size="11" text-anchor="middle">encrypted SSH</text>
    <text x="331" y="166" font-size="11" text-anchor="middle">connection</text>
    <text x="494" y="204" font-size="14" text-anchor="middle">bastion.example.com</text>
    <text x="494" y="226" font-size="11" text-anchor="middle">the SSH host</text>
    <text x="631" y="152" font-size="11" text-anchor="middle">reaches over</text>
    <text x="631" y="166" font-size="11" text-anchor="middle">the private network</text>
    <text x="742" y="204" font-size="15" text-anchor="middle">Postgres</text>
    <text x="742" y="226" font-size="11" text-anchor="middle">db.internal:5432</text>
  </g>
</svg>
